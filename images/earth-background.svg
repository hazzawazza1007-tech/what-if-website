<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Earth background illustration">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020d1d"/>
      <stop offset="45%" stop-color="#081b34"/>
      <stop offset="100%" stop-color="#112b4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#7cc7ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#1c74d7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d3c6a"/>
      <stop offset="50%" stop-color="#0a2d5d"/>
      <stop offset="100%" stop-color="#061a34"/>
    </linearGradient>
    <linearGradient id="land" x1="0" x2="1">
      <stop offset="0%" stop-color="#8ce3a3"/>
      <stop offset="100%" stop-color="#3fae79"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>

  <g opacity="0.85">
