    <circle cx="390" cy="710" r="2.5" fill="#ffffff"/>
    <circle cx="1220" cy="860" r="3" fill="#dfeeff"/>
  </g>

  <g filter="url(#softBlur)" opacity="0.42">
    <ellipse cx="980" cy="670" rx="500" ry="260" fill="#78d7ff"/>
