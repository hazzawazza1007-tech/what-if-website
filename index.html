<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore one extraordinary What If? scenario every day.">
  <title>WHAT IF? — A new question every day</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-dark: #07141f;
      --panel: rgba(17, 26, 38, 0.82);
      --panel-border: rgba(164, 192, 227, 0.18);
      --text: #edf3ff;
      --muted: #c4d7f7;
      --accent: #8ebdff;
      --accent-strong: #d7ebff;
      --success: #b7f7cc;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100vh;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: grid;
      place-items: center;
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(rgba(6, 15, 28, 0.68), rgba(6, 15, 28, 0.68)),
        url("./images/earth-background.svg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(1.5rem, 3vw, 3rem);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px var(--shadow);
    }

    .eyebrow {
      color: #9ec0f2;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0;
    }

    h1 {
      margin: 0.7rem 0 1.8rem;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    h2 {
      line-height: 1.2;
      margin: 0 0 1rem;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
    }

    #q {
      color: var(--text);
    }

    p {
      line-height: 1.7;
      margin: 0 0 1rem;
      color: var(--muted);
    }

    #intro {
      font-size: 1.1rem;
      color: var(--muted);
    }

    #ex {
      color: var(--text);
    }

    .about {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--panel-border);
      color: var(--muted);
    }

    .about h2 {
      font-size: 1.2rem;
      margin-bottom: 0.6rem;
    }

    button {
      margin-top: 1rem;
      padding: 0.85rem 1.2rem;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, #a9d0ff, #7bb1ff);
      color: #0d1929;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 25px rgba(127, 179, 255, 0.28);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(127, 179, 255, 0.35);
    }

    button:focus-visible {
      outline: 3px solid rgba(255,255,255,0.5);
      outline-offset: 3px;
    }

    #toast {
      min-height: 1.5em;
      margin-top: 0.8rem;
      color: var(--success);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.75rem;
      }

      main {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">A new scenario every day</p>
    <h1>WHAT IF?</h1>

    <h2 id="q">Loading today’s question…</h2>
    <p id="intro"></p>
    <p id="ex"></p>

    <button id="share" type="button">Share today’s scenario</button>
    <p id="toast" aria-live="polite"></p>

    <section class="about">
      <h2>About</h2>
      <p>Explore one extraordinary scenario through a short, clear explanation.</p>
    </section>
  </main>

  <script>
    const scenarios = [
      {
        question: "What if a record-sized tsunami hit?",
        intro: "Imagine an enormous wall of water approaching a populated coastline. What would happen if a record-breaking tsunami reached land?",
        explanation: "A massive tsunami could flood coastal communities, destroy buildings, damage roads and overwhelm emergency services. The impact would depend on the wave’s height, speed, the shape of the coastline and how much warning people had."
      },
      {
        question: "What if there was a meteor shower?",
        intro: "Imagine the night sky filling with streaks of light, followed by unusually large space rocks reaching the ground.",
        explanation: "Most meteors burn up harmlessly in the atmosphere. Exceptionally large fragments could survive the journey and cause explosions, fires and serious damage if they struck populated areas. The effects would depend on the size and number of the objects."
      },
      {
        question: "What if the Moon disappeared?",
        intro: "Imagine looking up at night and discovering that the Moon had suddenly vanished.",
        explanation: "Earth would lose its main source of tides, making ocean patterns change dramatically over time. Nights would also become much darker, and Earth’s long-term stability could be affected. The exact consequences would depend on how the Moon disappeared."
      },
      {
        question: "What if Earth stopped spinning?",
        intro: "Imagine the ground beneath your feet suddenly behaving as though the planet had stopped rotating.",
        explanation: "A sudden stop would cause enormous movement of the atmosphere and oceans. The consequences would be devastating, with extreme winds, flooding and widespread destruction. If Earth slowed gradually instead, the changes would happen differently over time."
      },
      {
        question: "What if every volcano erupted at once?",
        intro: "Imagine volcanoes around the world erupting at the same time, filling the sky with ash and smoke.",
        explanation: "Large eruptions could disrupt air travel, damage crops, affect breathing and cool parts of the planet by blocking sunlight. The actual effects would depend on the size of each eruption and how much ash and gas entered the atmosphere."
      },
      {
        question: "What if the Sun became twice as bright?",
        intro: "Imagine stepping outside and discovering that sunlight had suddenly become dramatically more intense.",
        explanation: "Earth would receive far more energy, raising temperatures and putting pressure on ecosystems, oceans and agriculture. The consequences would depend on how quickly the Sun’s brightness changed and how long it remained that way."
      }
    ];

    const perthParts = new Intl.DateTimeFormat("en", {
      timeZone: "Australia/Perth",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const getPart = (type) => perthParts.find((part) => part.type === type).value;
    const year = Number(getPart("year"));
    const month = Number(getPart("month"));
    const day = Number(getPart("day"));

    const todayNumber = Math.floor(Date.UTC(year, month - 1, day) / 86400000);
    const startNumber = Math.floor(Date.UTC(2026, 0, 1) / 86400000);
    const scenarioIndex =
      ((todayNumber - startNumber) % scenarios.length + scenarios.length) %
      scenarios.length;

    const today = scenarios[scenarioIndex];

    document.getElementById("q").textContent = today.question;
    document.getElementById("intro").textContent = today.intro;
    document.getElementById("ex").textContent = today.explanation;
    document.title = "WHAT IF? — " + today.question;

    document.querySelector(".about p").textContent =
      "Each day, WHAT IF? explores one extraordinary scenario through a visual and a short, clear explanation. Today's question: " +
      today.question;

    document.getElementById("share").addEventListener("click", async () => {
      const text = today.question + " " + today.intro + " Explore the scenario on WHAT IF?!";

      try {
        if (navigator.share) {
          await navigator.share({ title: "WHAT IF?", text });
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(text);
          document.getElementById("toast").textContent = "Scenario copied!";
        } else {
          document.getElementById("toast").textContent = "Sharing isn't available in this browser.";
        }
      } catch (error) {
        // The visitor may cancel the share dialog.
      }
    });

    const perthNow = new Date(Date.now() + 8 * 60 * 60 * 1000);
    const nextMidnight = Date.UTC(
      perthNow.getUTCFullYear(),
      perthNow.getUTCMonth(),
      perthNow.getUTCDate() + 1
    ) - 8 * 60 * 60 * 1000;

    setTimeout(() => location.reload(), nextMidnight - Date.now() + 1000);
  </script>
</body>
</html>
